# ┌───────────────────────────────────────────┐
# │  Redis Configuration                      │
# │  Cache and rate limiting                  │
# │  for development use ONLY                 │
# └───────────────────────────────────────────┘

bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300
daemonize no
databases 16
maxmemory 128mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
