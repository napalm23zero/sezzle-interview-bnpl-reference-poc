# ┌───────────────────────────────────────────┐
# │  Grafana Datasources                      │
# │  Auto-provisioned on startup              │
# │  for development use ONLY                 │
# └───────────────────────────────────────────┘

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://pulse-prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://pulse-jaeger:16686
    editable: false
